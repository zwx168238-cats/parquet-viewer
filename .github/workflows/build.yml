name: Build Installers

# 推送版本 tag(如 v0.1.0)时自动构建三平台安装包并创建 GitHub Release
# 也支持在 Actions 页面手动触发(workflow_dispatch)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon) -> .dmg
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          # Ubuntu amd64 -> .deb + .AppImage
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          # Windows amd64 -> .msi + .exe (NSIS)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: "Parquet Viewer v__VERSION__"
          releaseBody: |
            跨平台 Parquet 查看与 SQL 查询工具 (macOS / Linux / Windows)

            - macOS (Apple Silicon): `.dmg`
            - Linux (amd64): `.deb` / `.AppImage`
            - Windows (amd64): `.msi` / `.exe`
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
